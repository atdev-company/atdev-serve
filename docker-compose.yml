# One-command start (http://127.0.0.1:8100); pick one profile:
#   docker compose --profile c1m  up --build   # 1 client, multi-turn
#   docker compose --profile c1s  up --build   # 1 client, single-turn
#   docker compose --profile c32m up --build   # 32 clients, multi-turn
#   docker compose --profile c32s up --build   # 32 clients, single-turn
#   docker compose --profile c1s-accuracy up --build   # c1s without the 3-bit overlay
#   docker compose --profile c1m-accuracy up --build   # c1m without the 3-bit overlay
# The old profile names (c1, c1-single, c1-accuracy, c32, c32-single) still work and start the same service.
# Env (optional, e.g. in a .env file next to this file):
#   ATDEV_GPU   host GPU index to use (default 0)      ATDEV_PORT  host port (default 8100)
#   HF_TOKEN    Hugging Face token, only if your network/account needs one
# Model downloads and compiled kernels are kept in the named volumes below.
x-atdev: &atdev
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: atdev-serve:0.1.0
  ipc: host
  ports:
    - "${ATDEV_PORT:-8100}:8100"
  environment:
    - HF_TOKEN=${HF_TOKEN:-}
  volumes:
    - hf-cache:/root/.cache/huggingface
    - torch-ext:/root/.cache/torch_extensions
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${ATDEV_GPU:-0}"]
            capabilities: [gpu]

services:
  atdev-c1m:
    <<: *atdev
    profiles: ["c1m", "c1"]
    command: ["c1m"]
  atdev-c1s:
    <<: *atdev
    profiles: ["c1s", "c1-single"]
    command: ["c1s"]
  atdev-c1s-accuracy:
    <<: *atdev
    profiles: ["c1s-accuracy", "c1-accuracy"]
    command: ["c1s-accuracy"]
  atdev-c1m-accuracy:
    <<: *atdev
    profiles: ["c1m-accuracy"]
    command: ["c1m-accuracy"]
  atdev-c32m:
    <<: *atdev
    profiles: ["c32m", "c32"]
    command: ["c32m"]
  atdev-c32s:
    <<: *atdev
    profiles: ["c32s", "c32-single"]
    command: ["c32s"]

volumes:
  hf-cache:
  torch-ext:
